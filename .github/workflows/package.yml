name: Package

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  package:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: normlanguage/registry/.github/actions/setup-norm@d229852448570c786a3f86e62c7db36769ed9a18
        with:
          version: 0.27.14
      - uses: actions/setup-java@v4
        with:
          distribution: oracle
          java-version: 25.0.2
      - name: Build layout adapter
        shell: pwsh
        run: |
          ./gradlew.bat test --tests dev.normlanguage.ui.desktop.LayoutPaneTest verifyNativeImageMetadata publish --console=plain
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $cache = Join-Path $HOME '.norm/cache/maven'
          New-Item -ItemType Directory -Force $cache | Out-Null
          Copy-Item -Path build/repository/* -Destination $cache -Recurse -Force
      - name: Generate repository Skill
        shell: pwsh
        run: norm docs ui/desktop --output build/api --skill SKILL.md
      - uses: normlanguage/registry/.github/actions/package-module@77a26aef21f97b65c6343faf621412d91fed7a92
        id: package
        with:
          module-path: ui/desktop
          cache-directory: ~/.norm/cache/packages/github
      - name: Verify module tests
        shell: bash
        run: |
          module_dir="ui/desktop"
          if [[ -d "$module_dir/tests" ]]; then
            timeout 300 norm test "$module_dir"
          fi
      - name: Verify foundation window
        shell: bash
        run: timeout 300 norm test samples/foundation --filter samples.foundation.test.flow
      - name: Check minimal example
        shell: bash
        run: norm check samples/hello.norm
      - uses: normlanguage/registry/.github/actions/publish-module@77a26aef21f97b65c6343faf621412d91fed7a92
        with:
          archive: ${{ steps.package.outputs.archive }}
          version: ${{ steps.package.outputs.version }}


